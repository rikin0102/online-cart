<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231D4ED8'><path d='M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online Cart - Simple and secure ecommerce shopping application" />
    <title>Online Cart</title>
    <!-- Preconnect & DNS Prefetch to Cloud Backend for fast handshake -->
    <link rel="dns-prefetch" href="https://online-cart-lauc.onrender.com">
    <link rel="preconnect" href="https://online-cart-lauc.onrender.com" crossorigin>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Non-blocking pre-warm ping: wakes up Render server immediately while HTML parses -->
    <script>
      (function() {
        try {
          var apiUrl = (window.localStorage && window.localStorage.getItem('API_URL')) || 'https://online-cart-lauc.onrender.com';
          fetch(apiUrl.replace(/\/+$/, '') + '/health', { method: 'GET', mode: 'cors' }).catch(function(){});
        } catch(e) {}
      })();
    </script>
    <style>
      /* Instant Splash Screen before React bundle finishes loading */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAFAFB;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #1F2933;
        z-index: 9999;
      }
      .loader-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }
      .loader-brand svg {
        width: 32px;
        height: 32px;
        color: #1D4ED8;
      }
      .loader-brand span {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .loader-bar-wrap {
        width: 180px;
        height: 4px;
        background-color: #E5E7EB;
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background-color: #1D4ED8;
        border-radius: 99px;
        animation: initialLoaderSlide 1.2s ease-in-out infinite;
      }
      .loader-text {
        font-size: 13px;
        color: #6B7280;
        margin-top: 14px;
      }
      @keyframes initialLoaderSlide {
        0% { left: -40%; }
        50% { left: 40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-brand">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span>Online Cart</span>
        </div>
        <div class="loader-bar-wrap">
          <div class="loader-bar"></div>
        </div>
        <div class="loader-text">Starting application...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
